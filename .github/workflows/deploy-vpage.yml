name: Deploy Vpage Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-vpage.yml
      - visiond-mvp/package.json
      - visiond-mvp/package-lock.json
      - visiond-mvp/services/vpage/src/**
      - visiond-mvp/services/vpage/wrangler.toml

permissions:
  contents: read

concurrency:
  group: vpage-production
  cancel-in-progress: false

jobs:
  deploy-vpage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visiond-mvp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: visiond-mvp/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate Vpage contracts
        run: |
          node --check services/vpage/src/index.js
          node scripts/test-vpage-deploy-workflow.mjs
          node scripts/test-v020161-vpage-provisioning.mjs
          node scripts/test-v020161-vpage-provisioning-runtime.mjs
          node scripts/test-v020162-vpage-editor.mjs
          node scripts/test-v020162-vpage-editor-runtime.mjs
          node scripts/test-v020163-vpage-multi-items.mjs
          node scripts/test-v020163-vpage-multi-items-runtime.mjs

      - name: Validate Vpage Worker bundle
        run: node_modules/.bin/wrangler deploy --dry-run --strict --config services/vpage/wrangler.toml

      - name: Deploy Vpage Worker
        run: node_modules/.bin/wrangler deploy --strict --config services/vpage/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
