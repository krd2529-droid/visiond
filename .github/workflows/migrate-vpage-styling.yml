name: Migrate Vpage Styling Schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-vpage-styling.yml
      - visiond-mvp/services/vpage/migrations/0004_vpage_styling.sql
      - visiond-mvp/scripts/apply-vpage-styling-migration.mjs

permissions:
  contents: read

concurrency:
  group: vpage-production
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visiond-mvp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: visiond-mvp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/test-vpage-styling-migration.mjs
      - name: Apply and verify styling columns on isolated Vpage D1
        run: node scripts/apply-vpage-styling-migration.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
