plugins { id 'com.android.application' }
android {
    namespace 'com.smsmix.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smsmix.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.5.3'
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def store = System.getenv('VSMS_RELEASE_STORE_FILE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('VSMS_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('VSMS_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('VSMS_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('VSMS_RELEASE_STORE_FILE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
