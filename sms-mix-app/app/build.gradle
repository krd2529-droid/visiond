plugins { id 'com.android.application' }
android {
    namespace 'com.smsmix.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smsmix.app'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.5.17'
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def store = System.getenv('VSMS_RELEASE_STORE_FILE')
            if (store) {
                for (def name : ['VSMS_RELEASE_STORE_PASSWORD', 'VSMS_RELEASE_KEY_ALIAS', 'VSMS_RELEASE_KEY_PASSWORD']) {
                    if (!System.getenv(name)) throw new GradleException("Missing ${name} for VSMS signed release")
                }
                storeFile file(store)
                storePassword System.getenv('VSMS_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('VSMS_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('VSMS_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('VSMS_RELEASE_STORE_FILE')) signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { outputFileName = "VSMS-v${variant.versionName}-release.apk" }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
