<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีของฉัน — VisionD</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">VISIOND <small>ONLINE</small></a><nav><a href="/">หน้าร้าน</a></nav></header><main class="account-wrap"><section class="auth-card" id="authCard"><h1>บัญชีลูกค้า</h1><div class="tabs"><button data-tab="login" class="active">เข้าสู่ระบบ</button><button data-tab="register">สมัครสมาชิก</button></div><form id="loginForm"><input name="login" autocomplete="username" placeholder="ไอดีหรืออีเมล" required><input name="password" type="password" placeholder="รหัสผ่าน" required><button class="primary wide">เข้าสู่ระบบ</button></form><form id="registerForm" hidden><input name="name" placeholder="ชื่อ" required><input name="login" autocomplete="username" placeholder="ไอดีหรืออีเมล" required><input name="password" type="password" minlength="8" placeholder="รหัสผ่านอย่างน้อย 8 ตัว" required><button class="primary wide">สมัครสมาชิก</button></form><p id="authMsg"></p></section><section id="accountPanel" hidden><div class="section-head"><div><p class="eyebrow">MY ACCOUNT</p><h1>คำสั่งซื้อของฉัน</h1></div><button id="logoutBtn">ออกจากระบบ</button></div><div id="ordersList"></div></section></main><script src="/account.js"></script></body></html>
