<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionD Sales Page Center</title><link rel="stylesheet" href="/sales-page-center.css?v=014234"><link rel="stylesheet" href="/visiond-button-system.css?v=014234"><script src="/visiond-button-system.js?v=014234" defer></script></head><body><header><a href="/admin">← หลังบ้าน</a><div><small>VISIOND CONTROL</small><h1>ศูนย์สร้างเซลเพจ</h1><p>Ad Shortcut และ SEO Automation แยกกฎ Index/Approval ชัดเจน</p></div><b>v0.14.234</b></header><main><aside class="panel"><div class="heading"><h2>เซลเพจทั้งหมด</h2><button id="newPage">+ สร้างร่าง</button></div><div class="filters"><button data-filter="all">ทั้งหมด</button><button data-filter="ad_shortcut">ยิงแอด</button><button data-filter="seo_automation">SEO</button></div><div id="pages">กำลังโหลด…</div></aside><section class="panel editor"><div id="empty"><h2>เลือกเซลเพจหรือสร้างร่างใหม่</h2></div><form id="form" hidden><input type="hidden" name="id"><div class="heading"><div><small id="mode"></small><h2 id="formTitle">สร้างเซลเพจ</h2></div><span id="status" class="badge">draft</span></div><div class="grid"><label>ประเภท<select name="page_type" required><option value="ad_shortcut">Ad Shortcut Page</option><option value="seo_automation">SEO Automation Page</option></select></label><label>Template<select name="template_id" required></select></label><label>ชื่อหน้า<input name="title" maxlength="180" required></label><label>Slug<input name="slug" maxlength="120" required placeholder="worksheet-campaign"></label></div><label>หัวเรื่อง Hero<input name="hero" maxlength="240"></label><label>เนื้อหา<textarea name="body" maxlength="5000"></textarea></label><div class="grid"><label>ข้อความปุ่ม CTA<input name="cta" maxlength="80" value="ซื้อเลย"></label><label>Keyword หลัก (ใช้กับ SEO)<input name="keyword" maxlength="160"></label></div><fieldset><legend>สินค้าที่เชื่อมโยง</legend><input id="productSearch" type="search" placeholder="ค้นหาชื่อหรือ Slug"><div id="products" class="products"></div></fieldset><label>หมายเหตุ Revision<input name="change_note" maxlength="300" placeholder="สรุปสิ่งที่แก้"></label><div class="actions"><button type="submit">บันทึกร่าง</button><button type="button" data-action="submit_review">ส่งตรวจ</button><button type="button" data-action="approve" class="boss">อนุมัติ</button><button type="button" data-action="publish">เผยแพร่</button><button type="button" data-action="pause">พักหน้า</button><button type="button" data-action="archive">เก็บถาวร</button></div><p id="message" role="status" aria-live="polite"></p><h3>Preview มือถือ</h3><div class="phone"><iframe id="preview" title="ตัวอย่างเซลเพจบนมือถือ" sandbox=""></iframe></div><h3>ประวัติ Revision</h3><div id="revisions"></div></form></section></main><script src="/sales-page-center.js?v=014234"></script></body></html>
