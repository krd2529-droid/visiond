<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>เข้าสู่ระบบ V Easy · VisionD</title>
    <link rel="stylesheet" href="/veasy/login.css?v=014115" />
  <link rel="stylesheet" href="/visiond-button-system.css?v=014187" /><script src="/visiond-button-system.js?v=014187" defer></script></head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <p class="brand">VISIOND · V EASY</p>
        <h1>กำลังเปิดใช้งาน V Easy</h1>
        <p id="handoffHelp">VisionD จะตรวจข้อมูลอย่างปลอดภัย แล้วกลับเข้าแอปให้อัตโนมัติ</p>
        <form id="veasyLoginForm">
          <label>ID หรืออีเมล<input name="login" autocomplete="username" required /></label>
          <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required /></label>
          <label>คีย์ V Easy<input name="key" type="password" autocomplete="off" required /></label>
          <label>ชื่อร้านครั้งแรก<input name="shop_name" minlength="2" required /></label>
          <button id="loginSubmit" type="submit">ตรวจบัญชีและคีย์</button>
          <p id="loginState" role="status" aria-live="polite"></p>
        </form>
        <section id="loginSuccess" class="success" hidden>
          <b>เชื่อมบัญชีและคีย์สำเร็จ</b>
          <p id="loginOwner"></p>
          <div id="shopList"></div>
          <form id="shopBindForm" hidden>
            <h2>ผูกคีย์กับร้าน</h2>
            <label>ชื่อร้าน<input name="shop_name" required minlength="2" /></label>
            <label>Facebook Page ID<input name="meta_page_id" inputmode="numeric" pattern="[0-9]{5,40}" required /></label>
            <label>ชื่อเพจ (ไม่บังคับ)<input name="meta_page_name" /></label>
            <button id="bindSubmit" type="submit">ผูก 1 คีย์กับร้านนี้</button>
            <p id="bindState" role="status" aria-live="polite"></p>
          </form>
          <button id="returnToApp" type="button" hidden>เข้าใช้งาน V Easy</button>
          <button id="logoutApp" class="secondary" type="button">ออกจากระบบ</button>
        </section>
      </section>
    </main>
    <script src="/veasy/login.js?v=014115" type="module"></script>
  </body>
</html>
