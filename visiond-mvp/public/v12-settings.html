<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่าช่องทาง V12 | VisionD</title><link rel="stylesheet" href="/v12-connect.css?v=014247"><link rel="stylesheet" href="/visiond-button-system.css?v=014247"><script src="/visiond-button-system.js?v=014247" defer></script></head>
<body><header class="v12-head"><a href="/v12-connect.html">← กลับกล่องข้อความ</a><div><small>VISIOND CONTROL</small><h1>ตั้งค่าช่องทาง V12</h1><p>จัดการ Facebook Page และ Webhook แยกจากพื้นที่แชท</p></div><span>v0.14.247</span></header>
<main class="v12-panel"><h2>ตั้งค่า Facebook Page และ Webhook</h2><p>ค่าลับถูกเข้ารหัสและไม่แสดงกลับมา กรอกช่องค่าลับเฉพาะเมื่อต้องการเปลี่ยนค่าเท่านั้น</p><form id="v12Settings" data-feature="V12-CHANNEL-001"><label>Facebook Page ID<input name="page_id" required></label><label>ร้านสำหรับรับแชต<select name="shop_id" id="v12FacebookShop" required></select></label><label>Page Access Token <span id="v12TokenSaved" class="v12-saved"></span><input name="page_access_token" type="password" autocomplete="new-password" placeholder="กรอกเฉพาะเมื่อต้องการเปลี่ยน Token"></label><label>Meta App Secret <span id="v12SecretSaved" class="v12-saved"></span><input name="app_secret" type="password" autocomplete="new-password" placeholder="กรอกเฉพาะเมื่อต้องการเปลี่ยน App Secret"></label><button type="submit">บันทึกการตั้งค่า</button><button id="v12TestFacebook" type="button">ทดสอบการเชื่อมต่อ</button><div id="v12WebhookOutput" class="wide" hidden><label>Callback URL<input id="v12CallbackUrl" readonly></label><label>Verify Token — แสดงครั้งเดียว<input id="v12VerifyToken" readonly></label></div><p id="v12SettingsState" role="status"></p></form></main>
<script src="/v12-settings.js?v=014245"></script></body></html>
