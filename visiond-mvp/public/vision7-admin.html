<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Vision 7 Control</title><link rel="stylesheet" href="/vision7.css"></head><body><header class="top"><b>Vision 7 Control</b><a href="/admin.html">กลับหน้าผู้ดูแล</a></header><main class="wrap"><h1>โปรแกรม แพ็กเกจ คีย์ และตัวติดตั้ง</h1><div class="bar"><button id="newProgram">เพิ่มโปรแกรม</button><button id="newKey">ออกคีย์</button><a href="/ads-center.html">ศูนย์โฆษณา</a></div><section class="grid"><article class="card"><h2>โปรแกรม</h2><div id="programs"></div></article><article class="card"><h2>คีย์ล่าสุด</h2><div id="licenses"></div></article><article class="card"><h2>เผยแพร่ตัวติดตั้ง</h2><form id="releaseForm"><label>โปรแกรม<select name="program_id" id="releaseProgram" required></select></label><label>เวอร์ชันใหม่<input name="version" placeholder="1.1.0" required></label><label>เวอร์ชันต่ำสุดที่ยอมรับ<input name="minimum_version" placeholder="1.0.0" required></label><label><input name="mandatory" type="checkbox" value="1"> บังคับอัปเดตก่อนใช้งาน</label><label>รายละเอียดอัปเดต<textarea name="release_notes" maxlength="2000"></textarea></label><label>ไฟล์ติดตั้งไม่เกิน 95 MB<input name="file" type="file" required></label><button type="submit">อัปโหลดและเผยแพร่</button><p id="releaseState" class="muted"></p></form><div id="releases"></div></article></section></main><dialog id="programDialog"><form method="dialog"><h2>เพิ่มโปรแกรม</h2><label>รหัสโปรแกรม<input name="code" required></label><label>Product ID<input name="product_id" type="number"></label><label>แพลตฟอร์ม<select name="platform_type"><option>windows</option><option>mac</option><option>web</option><option>cross-platform</option></select></label><label>เวอร์ชัน<input name="current_version" value="1.0.0"></label><h3>Product ID ของแพ็กเกจขาย</h3><label>ตลอดชีพ<input name="lifetime_product_id" type="number"></label><label>รายเดือน<input name="monthly_product_id" type="number"></label><label>รายปี<input name="yearly_product_id" type="number"></label><button value="cancel">ยกเลิก</button><button id="saveProgram" value="default">บันทึก</button></form></dialog><script src="/vision7-admin.js" type="module"></script></body></html>
