<!doctype html><html lang="th"><head><link rel="icon" href="/favicon.svg?v=014428" type="image/svg+xml"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คลังบัญชีส่วนตัว | VisionD Control</title><link rel="stylesheet" href="/visiond-design-system.css?v=014407"><link rel="stylesheet" href="/account-vault.css?v=014591"><link rel="stylesheet" href="/visiond-button-system.css?v=014407"></head><body>
<header class="vault-toolbar"><a class="vds-btn vds-btn--text" href="/admin.html">← หลังบ้าน</a><div><small>VISIOND CONTROL · ACCOUNT-VAULT-001</small><h1>คลังบัญชีส่วนตัว</h1></div></header>
<main class="vault-shell"><section class="vault-card"><h2 id="formTitle">เพิ่มบัญชี</h2><form id="vaultForm"><label>แพลตฟอร์ม *<input name="platform" list="platforms" maxlength="80" required placeholder="เช่น Facebook, TikTok"><datalist id="platforms"><option value="Facebook"><option value="Instagram"><option value="TikTok"><option value="YouTube"><option value="Google"><option value="Canva"><option value="เว็บไซต์"></datalist></label><label>ชื่อบัญชีหรือชื่อช่อง *<input name="account_name" maxlength="160" required placeholder="เช่น Toys Center Official"></label><label class="wide">ลิงก์เข้าสู่ระบบ *<input name="login_url" type="url" maxlength="1000" required placeholder="https://..."></label><label>ไอดีล็อกอิน *<input name="login_id" maxlength="500" autocomplete="off" required></label><label>รหัสผ่าน *<span class="password-field"><input name="password" type="password" maxlength="1000" autocomplete="new-password" required><button id="togglePassword" type="button">แสดง</button></span></label><label>อีเมล<input name="email" type="email" maxlength="320" autocomplete="off"></label><label>เบอร์โทร<input name="phone" type="tel" maxlength="80" autocomplete="off"></label><label class="wide">หมายเหตุ<textarea name="note" rows="3" maxlength="3000" placeholder="เช่น ใช้กับเพจไหน หรือข้อมูลกู้คืนบัญชี"></textarea></label><div class="actions wide"><button id="saveAccount" class="vds-btn vds-btn--primary">บันทึกบัญชี</button><button id="cancelEdit" class="vds-btn vds-btn--secondary" type="button" hidden>ยกเลิกแก้ไข</button></div></form><p id="vaultStatus" role="status" aria-live="polite"></p></section>
<section class="vault-card"><div class="list-head"><div><h2>บัญชีที่บันทึกไว้</h2><b id="accountCount">0 รายการ</b></div><input id="accountSearch" type="search" placeholder="ค้นหาแพลตฟอร์มหรือชื่อช่อง"></div><div id="accountList" class="account-list"></div></section></main>
<script src="/account-vault.js?v=014591" type="module"></script><script src="/visiond-button-system.js?v=014407" defer></script></body></html>
