<!doctype html>
<html lang="th">
<head>
  <link rel="icon" href="/favicon.svg?v=014428" type="image/svg+xml">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>คลังโน้ต | VisionD Control</title>
  <link rel="stylesheet" href="/visiond-design-system.css?v=014407">
  <link rel="stylesheet" href="/work-notes.css?v=014610">
  <link rel="stylesheet" href="/visiond-button-system.css?v=014407">
</head>
<body>
<header class="notes-toolbar"><a class="vds-btn vds-btn--text" href="/admin.html">← หลังบ้าน</a><div><small>VISIOND CONTROL · WORK-NOTES-001</small><h1>คลังโน้ตทำ PowerPoint</h1></div></header>
<main class="notes-shell"><section class="notes-card editor"><h2 id="formTitle">เพิ่มโน้ต</h2><form id="noteForm"><label>หัวข้อ *<input id="noteTitle" maxlength="160" required placeholder="เช่น แผนคอนเทนต์ TikTok เดือนนี้"></label><label>เนื้อหาโน้ต *<span class="content-tools"><button id="attachImage" class="vds-btn vds-btn--secondary" type="button">📎 แนบรูปตรงตำแหน่งนี้</button><small>หรือพิมพ์ /แนบ แล้ววางรูปแคป · รูปจะแสดงเป็นป้ายสั้น</small></span><textarea id="noteContent" maxlength="30000" rows="12" required placeholder="เขียนหรือวางข้อมูลทั้งหมดที่ต้องการใช้ทำสไลด์"></textarea><input id="noteImages" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><div id="attachmentChips" class="attachment-chips"></div></label><div class="actions"><button id="saveNote" class="vds-btn vds-btn--primary">บันทึกโน้ตและรูป</button><button id="cancelEdit" class="vds-btn vds-btn--secondary" type="button" hidden>ยกเลิกแก้ไข</button></div></form><p id="noteStatus" role="status" aria-live="polite"></p></section>
<section class="notes-card"><div class="list-head"><div><h2>โน้ตทั้งหมด</h2><b id="noteCount">0 รายการ</b></div><input id="noteSearch" type="search" placeholder="ค้นหาหัวข้อหรือเนื้อหา"></div><div id="noteList" class="note-list"></div></section></main>
<dialog id="pptOptions"><form method="dialog" class="ppt-options"><h2>เตรียมเนื้อหาก่อนสร้าง PowerPoint</h2><label>ธีมสี<select id="pptTheme"><option value="blue">เขียวทิฟฟานี่ VisionD · พื้นขาว</option><option value="teal">เขียวอมฟ้า</option><option value="purple">ม่วง</option><option value="orange">ส้ม</option><option value="dark">เข้ม</option></select></label><label>รูปธีมต้นแบบ <small>แนบรูปงานเก่าเพื่อให้ PowerPoint ใหม่ใช้โทนสีเดียวกัน โดยไม่แปะข้อความเก่าลงสไลด์</small><input id="pptThemeImage" type="file" accept="image/jpeg,image/png,image/webp"><span id="pptThemeImageStatus" class="theme-image-status">ไม่ได้เลือกรูป · จะใช้ธีม VisionD</span></label><label>ความต้องการในการสร้าง<textarea id="pptInstructions" rows="4" maxlength="2000" placeholder="เช่น ทำ 8 สไลด์ โทนขายสินค้า เน้นรูปแคปและสรุปให้อ่านง่าย"></textarea></label><button id="expandContent" class="vds-btn vds-btn--secondary" type="button">✨ ให้ AI เติมและเรียบเรียงเนื้อหาก่อน</button><label>เนื้อหาที่เตรียมแล้ว <small>ตรวจและแก้ไขได้ก่อนสร้างสไลด์</small><textarea id="expandedContent" rows="12" maxlength="30000" placeholder="ต้องกดให้ AI เติมเนื้อหาก่อนสร้าง PowerPoint"></textarea></label><p id="expandStatus" role="status"></p><div class="actions"><button id="confirmPpt" class="vds-btn vds-btn--primary" value="default" disabled>สร้างและดาวน์โหลด PowerPoint</button><button class="vds-btn vds-btn--secondary" value="cancel">ยกเลิก</button></div></form></dialog>
<script src="/vendor/pptxgen.min.js?v=014617"></script><script src="/work-notes.js?v=014617" type="module"></script><script src="/visiond-button-system.js?v=014407" defer></script>
</body>
</html>
