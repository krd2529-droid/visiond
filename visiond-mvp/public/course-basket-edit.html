<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>แก้ไขตะกร้าคอร์ส | VisionD</title>
    <link rel="stylesheet" href="/style.css?v=014130" />
    <link rel="stylesheet" href="/visiond-design-system.css?v=014130" />
    <link rel="stylesheet" href="/course-seller.css?v=014130" />
    <link rel="stylesheet" href="/elon-chat.css?v=014130" />
    <link rel="stylesheet" href="/mobile-storefront.css?v=014130" />
    <link rel="stylesheet" href="/frontend-theme.css?v=014130" />
  </head>
  <body class="vd-frontend">
    <header class="topbar">
      <a class="brand" href="/">VISIOND <small>COURSE SELLER</small></a>
      <nav><a href="/course-seller.html">← กลับตะกร้าคอร์ส</a></nav>
    </header>
    <main class="seller-shell">
      <section class="seller-card">
        <p class="eyebrow">COURSE BASKET</p>
        <h1>แก้ไขข้อมูลตะกร้าคอร์ส</h1>
        <p id="editExpiry"></p>
        <form id="courseBasketEditForm" class="seller-form">
          <label class="course-cover-upload"
            >รูปปกตะกร้าคอร์ส <small>ไม่เลือกรูปใหม่ = ใช้รูปเดิม</small
            ><input
              id="editCoverInput"
              name="cover"
              type="file"
              accept="image/jpeg,image/png,image/webp"
            />
            <figure id="editCoverPreview" class="course-cover-preview">
              <img alt="ตัวอย่างรูปปกตะกร้าคอร์ส" />
              <figcaption>
                <button id="changeEditCover" type="button">เปลี่ยนรูป</button
                ><button id="restoreEditCover" type="button">ใช้รูปเดิม</button>
              </figcaption>
            </figure></label
          ><label>ชื่อตะกร้าคอร์ส<input name="title" required /></label
          ><label>ชื่อผู้สอน<input name="teacher_name" required /></label
          ><label>คำอธิบายสั้น<input name="short_description" /></label
          ><label class="span2"
            >รายละเอียดคอร์ส<textarea
              name="description"
              rows="6"
              required
            ></textarea></label
          ><label
            >ราคา (บาท)<input
              name="price_baht"
              type="number"
              min="1"
              step="0.01"
              required /></label
          ><input name="learner_level" type="hidden" value="all" /><label
            >ช่องทางติดต่อ<input name="contact_info" required
          /></label>
          <fieldset class="span2">
            <legend>หัวข้อหรือแพลตฟอร์มที่สอน</legend>
            <div id="editPlatformTags" class="platform-tags"></div>
            <label>อื่น ๆ<input name="platform_other" /></label>
          </fieldset>
          <button class="primary span2" type="submit">
            บันทึกและส่งให้ Boss ตรวจใหม่</button
          ><a class="span2" href="/course-seller.html">ยกเลิกและกลับ</a>
          <p id="courseBasketEditMessage" class="span2"></p>
        </form>
      </section>
    </main>
    <script src="/course-basket-edit.js?v=014130"></script>
    <script src="/elon-chat.js?v=014130" defer></script>
    <script src="/mobile-storefront.js?v=014130" defer></script>
    <script src="/visiond-design-system.js?v=014130" defer></script>
  </body>
</html>
