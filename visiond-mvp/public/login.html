<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีลูกค้า | VisionD Online</title><meta name="description" content="เข้าสู่ระบบหรือสมัครสมาชิก VisionD Online เพื่อซื้อและปลดล็อกสินค้าดิจิทัล คอร์สเรียน และโปรแกรมบอท"><link rel="stylesheet" href="/style.css"></head><body class="auth-page">
<header class="topbar"><a class="brand" href="/">VISIOND <small>ONLINE</small></a><nav><a href="/digital-products.html">สินค้า</a><a href="/courses.html">คอร์สเรียน</a><a href="/bots.html">โปรแกรมบอท</a><a href="https://lin.ee/rU7lTLb6" target="_blank" rel="noopener">ติดต่อ LINE</a></nav></header>
<main class="auth-shell auth-single"><section class="auth-box auth-switch-box"><div class="auth-box-head"><p class="eyebrow dark">VISIOND MEMBER</p><h1>บัญชีลูกค้า</h1></div><div class="auth-tabs" role="tablist"><button class="active" type="button" data-auth-tab="login">เข้าสู่ระบบ</button><button type="button" data-auth-tab="register">สมัครสมาชิก</button></div>
<form id="loginPageForm" data-auth-panel="login"><label>ไอดีหรืออีเมล<input name="login" autocomplete="username" placeholder="กรอกไอดีหรืออีเมล" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required></label><div class="form-row"><label class="check-line"><input type="checkbox" name="remember"> จดจำการเข้าสู่ระบบ</label><a href="/forgot-password.html">ลืมรหัสผ่าน?</a></div><button class="primary wide" type="submit">เข้าสู่ระบบ</button></form>
<form id="registerPageForm" data-auth-panel="register" hidden><label>ชื่อที่แสดง<input name="name" autocomplete="name" placeholder="ชื่อของคุณ" required></label><label>ไอดีสมาชิก<input name="username" autocomplete="username" placeholder="ตั้งไอดีสมาชิก" minlength="3" required></label><label>อีเมล<input name="email" type="email" autocomplete="email" placeholder="name@example.com" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัว" minlength="8" required></label><button class="primary wide" type="submit">สมัครสมาชิก</button></form><p id="pageAuthMsg" class="auth-message"></p></section></main>
<script src="/member-auth.js"></script></body></html>
