<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบ | VisionD Online</title>
  <meta name="description" content="เข้าสู่ระบบ VisionD Online เพื่อเข้าถึงสินค้าดิจิทัล คอร์สเรียน และโปรแกรมบอทที่ซื้อไว้">
  <link rel="stylesheet" href="/style.css?v=01360">
<script src="/meta-pixel.js?v=01193"></script></head>
<body class="auth-page">
<header class="topbar">
  <a class="brand" href="/">VISIOND <small>ONLINE</small></a>
  <nav><a class="nav-home-link" href="/">หน้าแรก</a>
    <a href="/digital-products.html">สินค้า</a>
    <a href="/courses.html">คอร์สเรียน</a>
    <a href="/bots.html">โปรแกรมบอท</a>
    <a href="https://lin.ee/RJZwr1p" target="_blank" rel="noopener">ติดต่อ LINE</a>
  </nav>
</header>
<main class="auth-shell auth-single">
  <section class="auth-box">
    <div class="auth-box-head">
      <p class="eyebrow dark">VISIOND MEMBER</p>
      <h1>เข้าสู่ระบบ</h1>
      <p>ใช้ไอดีสมาชิกหรืออีเมลที่สมัครกับ VisionD</p>
    </div>
    <form id="loginPageForm">
      <label>ไอดีสมาชิกหรืออีเมล
        <input name="login" autocomplete="username" placeholder="กรอกไอดีสมาชิกหรืออีเมล" required>
      </label>
      <label>รหัสผ่าน
        <input name="password" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required>
      </label>
      <div class="form-row">
        <label class="check-line"><input type="checkbox" name="remember"> จดจำการเข้าสู่ระบบ</label>
        <a href="/forgot-password.html">ลืมรหัสผ่าน?</a>
      </div>
      <button class="primary wide" type="submit">เข้าสู่ระบบ</button>
    </form>
    <p id="pageAuthMsg" class="auth-message" aria-live="polite"></p>
    <div class="auth-divider"><span>ยังไม่มีบัญชี VisionD</span></div>
    <a class="secondary-button wide center" href="/register.html">สมัครสมาชิก</a>
  </section>
</main>
<script src="/security.js?v=01186"></script><script src="/member-auth.js?v=01186"></script>
<script src="/facebook-chat.js?v=01380"></script></body>
</html>
